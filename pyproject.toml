[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinsight"
version = "0.4.0"
description = "A small, actively-built RNA-seq pipeline: validation, QC, low-count filtering, normalization, exploratory differential expression, visualization, and pathway enrichment."
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "scikit-learn",
    "anthropic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bioinsight*"]