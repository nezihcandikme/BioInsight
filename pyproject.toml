[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omicforge"
version = "0.11.0"
description = "A small, actively-built RNA-seq pipeline: validation, QC, low-count filtering, normalization, exploratory differential expression (Welch's, empirical-Bayes-moderated, or covariate-adjusted), gene ID/symbol annotation, visualization, local and live (g:Profiler) pathway enrichment, and GEO data acquisition helpers, runnable as a library or a CLI."
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "scikit-learn",
    "anthropic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
omicforge = "omicforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omicforge*"]