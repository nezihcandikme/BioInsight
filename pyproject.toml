[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deconcord"
version = "0.12.0"
description = "DEConcord: robustness/concordance analysis for RNA-seq differential expression -- given DE result tables from DESeq2, edgeR, or any other tool, computes method concordance (significant-gene overlap, directional and effect-size agreement, concordant/discordant genes). Also ships the RNA-seq pipeline (validation, QC, normalization, exploratory/covariate-adjusted DE, annotation, pathway enrichment, visualization) that generates the DE tables it compares."
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "scikit-learn",
    "anthropic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
deconcord = "deconcord.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deconcord*"]